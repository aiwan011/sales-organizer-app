<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Team Members</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let member of teamMembers" [routerLink]="['/selected-tasks', { category: 'teammember', criteria: member.name }]" routerDirection="forward">
      <ion-label>{{ member.name }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
