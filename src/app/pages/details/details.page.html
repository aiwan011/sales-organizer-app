<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ task.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Details</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Add this card to show the task info -->
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Task #{{ task.number }}</ion-card-subtitle>
      <ion-card-title>{{ task.title }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      {{ task.description }}
    </ion-card-content>
  </ion-card>

</ion-content>
