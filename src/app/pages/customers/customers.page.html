<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Customers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let customer of customers" routerLink="/list" routerDirection="forward">
      <ion-label>{{ customer.name }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
